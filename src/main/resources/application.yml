server:
  port: 8090

spring:
  application:
    name: issuebot
  config:
    import: optional:file:${user.home}/.issuebot/config.yml
  datasource:
    url: jdbc:h2:file:${user.home}/.issuebot/issuebot
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
# IssueBot defaults (overridden by ~/.issuebot/config.yml)
issuebot:
  agent-provider: claude # claude or codex; legacy claude-code remains accepted
  poll-interval-seconds: 60
  max-concurrent-issues: 3
  work-directory: ${user.home}/.issuebot/repos
  claude-code:
    max-turns-per-invocation: 30
    # Wall-clock caps. These values (not the Java field defaults) are what actually apply when a
    # key is absent from ~/.issuebot/config.yml, so they must carry the real defaults.
    # Implementation/planning: a real agentic run (explore → write → test → iterate) routinely
    # exceeds 10 minutes; the old cap killed healthy runs mid-flight and discarded the work.
    timeout-minutes: 45
    implementation-model: claude-opus-4-8
    review-model: claude-sonnet-5
    utility-model: claude-haiku-4-5
    # Omitted reasoning uses the exact selected model's catalog default. Settings saves
    # explicit reasoning with each model; keep omission compatible with pre-0.6 config.
    review-max-turns: 15
    # Review/utility: smaller than implementation (it only reads a diff and returns a verdict),
    # but 5 minutes was too tight for large diffs — the real cause of "Review Could Not Run".
    review-timeout-minutes: 20
  codex-cli:
    implementation-model: gpt-5.6-sol
    implementation-reasoning-effort: low
    review-model: gpt-5.6-terra
    review-reasoning-effort: medium
    utility-model: gpt-5.6-luna
    utility-reasoning-effort: medium
    timeout-minutes: 45
    review-timeout-minutes: 20
  auth:
    username: ${ISSUEBOT_USERNAME:}
    password: ${ISSUEBOT_PASSWORD:}
  github:
    token: ${GITHUB_TOKEN:not-set}
  notifications:
    desktop: true
    dashboard: true
  repositories: []

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,issueBotLiveness
        readiness:
          include: readinessState,db,diskSpace,persistentStorage
  info:
    build:
      enabled: true
