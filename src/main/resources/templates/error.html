<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content" data-navigation-error>
    <div th:replace="~{layout :: toasts}"></div>
    <div class="page-header">
        <h2 th:text="${errorTitle}">Error</h2>
    </div>
    <div class="panel">
        <div class="panel-body empty-state error-state" role="alert">
            <i class="ti ti-alert-circle" aria-hidden="true"></i>
            <p class="empty-state-title" th:text="${errorMessage}">An error occurred.</p>
            <a th:href="${backLink != null ? backLink : '/'}"
               th:attr="hx-get=${backLink != null ? backLink : '/'}"
               hx-target="#content" hx-push-url="true"
               th:text="${backLabel != null ? backLabel : 'Back to Dashboard'}"
               data-navigation-return class="btn btn-primary mt-2">Back to Dashboard</a>
            <nav class="pager mt-2" aria-label="Issue navigation" data-navigation-sequence hidden>
                <span class="pager-info" data-navigation-sequence-label>In this result set</span>
                <a class="btn btn-ghost btn-sm" href="/issues" hx-get="/issues" hx-target="#content"
                   hx-push-url="true" data-navigation-previous hidden>Previous</a>
                <button type="button" class="btn btn-ghost btn-sm" data-navigation-previous-disabled disabled hidden>Previous</button>
                <a class="btn btn-ghost btn-sm" href="/issues" hx-get="/issues" hx-target="#content"
                   hx-push-url="true" data-navigation-next hidden>Next</a>
                <button type="button" class="btn btn-ghost btn-sm" data-navigation-next-disabled disabled hidden>Next</button>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
