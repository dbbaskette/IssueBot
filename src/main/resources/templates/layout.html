<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <script>
      (function(){var t=localStorage.getItem('theme')
        ||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
        document.documentElement.setAttribute('data-theme',t);})();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' — IssueBot' : 'IssueBot'}">IssueBot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
    <script src="https://unpkg.com/idiomorph@0.3.0/dist/idiomorph-ext.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
    <a href="#content" class="skip-link">Skip to content</a>

    <!-- Mobile menu toggle (hidden on desktop) -->
    <button class="mobile-menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <span></span><span></span><span></span>
    </button>
    <div class="sidebar-overlay"></div>
    <nav class="sidebar" id="sidebar" aria-label="Main navigation">
        <header style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem">
            <h1>IssueBot</h1>
            <span id="sse-status" class="sse-dot" data-state="none" title="No live stream on this page"></span>
        </header>
        <ul>
            <li><a th:classappend="${activePage == 'dashboard' ? 'active' : ''}" th:attr="aria-current=${activePage == 'dashboard'} ? 'page' : null" href="/" hx-get="/" hx-target="#content" hx-push-url="true">Dashboard</a></li>
            <li><a th:classappend="${activePage == 'repositories' ? 'active' : ''}" th:attr="aria-current=${activePage == 'repositories'} ? 'page' : null" href="/repositories" hx-get="/repositories" hx-target="#content" hx-push-url="true">Repositories</a></li>
            <li><a th:classappend="${activePage == 'issues' ? 'active' : ''}" th:attr="aria-current=${activePage == 'issues'} ? 'page' : null" href="/issues" hx-get="/issues" hx-target="#content" hx-push-url="true">Issue Queue</a></li>
            <li>
                <a th:classappend="${activePage == 'approvals' ? 'active' : ''}" th:attr="aria-current=${activePage == 'approvals'} ? 'page' : null" href="/approvals" hx-get="/approvals" hx-target="#content" hx-push-url="true">
                    Approvals
                    <span th:if="${pendingApprovals != null and pendingApprovals > 0}" class="badge" th:text="${pendingApprovals}">0</span>
                </a>
            </li>
            <li><a th:classappend="${activePage == 'costs' ? 'active' : ''}" th:attr="aria-current=${activePage == 'costs'} ? 'page' : null" href="/costs" hx-get="/costs" hx-target="#content" hx-push-url="true">Cost Report</a></li>
            <li><a th:classappend="${activePage == 'settings' ? 'active' : ''}" th:attr="aria-current=${activePage == 'settings'} ? 'page' : null" href="/settings" hx-get="/settings" hx-target="#content" hx-push-url="true">Settings</a></li>
            <li><a th:classappend="${activePage == 'setup' ? 'active' : ''}" th:attr="aria-current=${activePage == 'setup'} ? 'page' : null" href="/setup" hx-get="/setup" hx-target="#content" hx-push-url="true">Setup</a></li>
        </ul>
        <footer>
            <!--
              Refreshed independently of any page-specific poll (the sidebar is static
              chrome shared by every page) via its own small fragment endpoint — see
              SettingsController#agentStatusFragment. th:fragment="agent-status" makes
              this same markup addressable as "layout :: agent-status" for that endpoint's
              response; on a normal full-page render th:fragment is a no-op and the div
              renders in place as usual (same trick as the "toasts" fragment below).
            -->
            <div class="agent-status" id="agent-status-chip" th:fragment="agent-status"
                 hx-get="/settings/fragments/agent-status" hx-trigger="every 30s"
                 hx-target="this" hx-swap="outerHTML">
                <span class="status-dot" th:classappend="${agentRunning != null and agentRunning ? 'running' : 'paused'}"></span>
                <span th:text="${agentRunning != null and agentRunning ? 'Agent Running' : 'Agent Paused'}">Agent Running</span>
            </div>
            <button id="theme-toggle" class="btn btn-ghost" type="button" aria-label="Toggle light or dark theme">
                <i class="ti ti-moon" aria-hidden="true"></i>
            </button>
        </footer>
    </nav>
    <main id="content">
        <div th:replace="~{${contentTemplate} :: content}"></div>
    </main>
    <script th:src="@{/js/app.js}" defer></script>

    <!--
      Toast region — the SINGLE source of truth is the content fragments, each of
      which includes ~{layout :: toasts} as their first child (on both full page
      loads and HTMX content swaps). The fragment is DEFINED here (so the include
      resolves) but is wrapped in a th:block that is never rendered on its own:
      the th:if="false" on the wrapper suppresses the wrapper's output on a full
      page load, while the th:fragment="toasts" element inside it remains
      addressable by ~{layout :: toasts} for the content-fragment includes.
    -->
    <th:block th:if="${false}">
        <div th:fragment="toasts" id="toast-region" aria-live="polite">
            <div th:if="${success}" class="toast toast-ok" th:text="${success}"></div>
            <div th:if="${message}" class="toast toast-ok" th:text="${message}"></div>
            <div th:if="${error}" class="toast toast-danger" th:text="${error}"></div>
        </div>
    </th:block>
</body>
</html>
