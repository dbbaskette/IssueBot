<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!--
  Notification-bell dropdown panel (#89) — a standalone template (not a page; there is no
  full-page route for this) so NotificationController can address it as
  "notifications :: panel" the same way SettingsController addresses "layout :: agent-status".
  Always rendered as an HTMX fragment, swapped into layout.html's #notif-panel container.
-->
<body>
<div th:fragment="panel" id="notif-panel-content" th:attr="data-unread-count=${unreadCount}">
    <div class="notif-panel-header">
        <span class="notif-panel-title">Notifications</span>
        <button type="button" class="btn btn-ghost btn-sm" th:if="${unreadCount != null and unreadCount > 0}"
                hx-post="/notifications/read" hx-target="#notif-panel" hx-swap="innerHTML">
            Mark all read
        </button>
    </div>
    <ul class="notif-list" th:if="${not #lists.isEmpty(notifications)}">
        <li th:each="n : ${notifications}" class="notif-item" th:classappend="${n.readAt == null} ? 'is-unread' : ''">
            <a th:if="${n.issueId != null}" th:href="@{/issues/{id}(id=${n.issueId})}" class="notif-item-content">
                <span class="notif-item-icon" th:classappend="'sev-' + ${#strings.toLowerCase(n.severity)}">
                    <i th:class="${n.severity.name() == 'WARN'} ? 'ti ti-alert-triangle' : (${n.severity.name() == 'ERROR'} ? 'ti ti-alert-circle' : 'ti ti-info-circle')" aria-hidden="true"></i>
                </span>
                <span class="notif-item-body">
                    <span class="notif-item-title" th:text="${n.title}">Title</span>
                    <span class="notif-item-detail" th:text="${n.detail}">Detail</span>
                </span>
                <span class="notif-item-time" th:text="${#temporals.format(n.createdAt, 'MMM d, HH:mm')}">00:00</span>
            </a>
            <div th:unless="${n.issueId != null}" class="notif-item-content">
                <span class="notif-item-icon" th:classappend="'sev-' + ${#strings.toLowerCase(n.severity)}">
                    <i th:class="${n.severity.name() == 'WARN'} ? 'ti ti-alert-triangle' : (${n.severity.name() == 'ERROR'} ? 'ti ti-alert-circle' : 'ti ti-info-circle')" aria-hidden="true"></i>
                </span>
                <span class="notif-item-body">
                    <span class="notif-item-title" th:text="${n.title}">Title</span>
                    <span class="notif-item-detail" th:text="${n.detail}">Detail</span>
                </span>
                <span class="notif-item-time" th:text="${#temporals.format(n.createdAt, 'MMM d, HH:mm')}">00:00</span>
            </div>
        </li>
    </ul>
    <p class="text-muted notif-empty" th:if="${#lists.isEmpty(notifications)}">No notifications yet.</p>
</div>
</body>
</html>
