<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div th:replace="~{layout :: toasts}"></div>

    <div class="page-header">
        <h2>Repositories</h2>
        <button class="btn btn-primary" type="button" data-show-add-form>
            <i class="ti ti-plus" aria-hidden="true"></i> Add Repository
        </button>
    </div>

    <!-- Add/Edit Form -->
    <div id="add-repo-form" class="panel mb-3" hidden>
        <div class="panel-header">
            <h3 id="form-title">Add Repository</h3>
            <button class="btn btn-outline btn-sm" type="button" data-cancel-form>
                <i class="ti ti-x" aria-hidden="true"></i> Cancel
            </button>
        </div>
        <div class="panel-body">
            <form hx-post="/repositories" hx-target="#content" hx-swap="innerHTML"
                  hx-disabled-elt="find button[type='submit']">
                <input type="hidden" id="edit-id" name="id" value="">

                <!-- Identity -->
                <h4 class="form-section-title"><i class="ti ti-brand-github" aria-hidden="true"></i> Repository</h4>
                <div class="form-grid">
                    <div class="field-group">
                        <label for="owner">Owner</label>
                        <input type="text" id="owner" name="owner" required placeholder="e.g. my-org">
                    </div>
                    <div class="field-group">
                        <label for="repo-name">Repository</label>
                        <input type="text" id="repo-name" name="name" required placeholder="e.g. my-app">
                    </div>
                    <div class="field-group">
                        <label for="branch">Branch</label>
                        <input type="text" id="branch" name="branch" value="main" required>
                    </div>
                </div>

                <!-- Workflow -->
                <h4 class="form-section-title"><i class="ti ti-route" aria-hidden="true"></i> Workflow</h4>
                <div class="form-grid">
                    <div class="field-group">
                        <label for="mode">Mode</label>
                        <select id="mode" name="mode">
                            <option value="AUTONOMOUS">Autonomous</option>
                            <option value="APPROVAL_GATED">Approval Gated</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label for="max-iterations">Max Iterations</label>
                        <input type="number" id="max-iterations" name="maxIterations" value="5" min="1" max="20">
                    </div>
                    <div class="field-group">
                        <label for="max-review-iterations">Max Review Iterations</label>
                        <input type="number" id="max-review-iterations" name="maxReviewIterations" value="2" min="1" max="10">
                    </div>
                    <div class="field-group">
                        <label for="review-pass-threshold">Review pass threshold</label>
                        <input type="number" id="review-pass-threshold" name="reviewPassThreshold"
                               value="0.70" min="0.5" max="0.95" step="0.05">
                    </div>
                    <div class="field-group">
                        <label for="issue-budget-usd">Issue budget (USD, blank = unlimited)</label>
                        <input type="number" id="issue-budget-usd" name="issueBudgetUsd"
                               step="0.50" min="0" placeholder="unlimited">
                    </div>
                    <div class="field-group">
                        <label for="implementation-model">Implementation model (blank = inherit global)</label>
                        <select id="implementation-model" name="implementationModel">
                            <option value="">Inherit global</option>
                            <option th:each="m : ${modelCatalog}" th:value="${m.id}" th:text="${m.displayName}"></option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label for="review-model">Review model (blank = inherit global)</label>
                        <select id="review-model" name="reviewModel">
                            <option value="">Inherit global</option>
                            <option th:each="m : ${modelCatalog}" th:value="${m.id}" th:text="${m.displayName}"></option>
                        </select>
                    </div>
                    <div class="checkbox-field">
                        <input type="checkbox" id="auto-start" name="autoStart" value="true" checked>
                        <label for="auto-start">Auto-start issues</label>
                    </div>
                    <div class="field-group">
                        <label for="follow-up-mode">Review findings handling</label>
                        <select id="follow-up-mode" name="followUpMode">
                            <option value="ROLLING_BACKLOG">Rolling backlog issue (recommended)</option>
                            <option value="COMMENT_ONLY">Comment on issue only</option>
                            <option value="PER_ISSUE">One follow-up issue per PR (legacy)</option>
                            <option value="OFF">Off — PR review comment only</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label for="decomposition-mode">Large-issue splitting</label>
                        <select id="decomposition-mode" name="decompositionMode">
                            <option value="PROPOSE">Propose — I approve splits (recommended)</option>
                            <option value="AUTO">Automatic (legacy)</option>
                            <option value="OFF">Off — escalate to needs-human</option>
                        </select>
                    </div>
                    <div class="checkbox-field">
                        <input type="checkbox" id="pre-screen-enabled" name="preScreenEnabled" value="true" checked>
                        <label for="pre-screen-enabled">Pre-screen issue size before implementing</label>
                    </div>
                </div>

                <!-- Safety -->
                <h4 class="form-section-title"><i class="ti ti-shield-lock" aria-hidden="true"></i> Safety</h4>
                <div class="form-grid">
                    <div class="checkbox-field">
                        <input type="checkbox" id="auto-merge" name="autoMerge" value="true">
                        <label for="auto-merge">Auto-merge PRs (squash)</label>
                    </div>
                    <div class="checkbox-field">
                        <input type="checkbox" id="security-review" name="securityReviewEnabled" value="true">
                        <label for="security-review">Security review (OWASP)</label>
                    </div>
                    <div class="field-group full-width">
                        <label for="allowed-paths">Allowed Paths (comma-separated)</label>
                        <input type="text" id="allowed-paths" name="allowedPaths" placeholder="src/, test/">
                    </div>
                    <div class="field-group full-width">
                        <label for="verification-commands">Verification commands (one per line, run before CI/push)</label>
                        <textarea id="verification-commands" name="verificationCommands" rows="3"
                                  placeholder="./mvnw -q verify&#10;npm run lint"></textarea>
                    </div>
                </div>

                <!-- CI -->
                <h4 class="form-section-title"><i class="ti ti-rocket" aria-hidden="true"></i> CI</h4>
                <div class="form-grid">
                    <div class="checkbox-field">
                        <input type="checkbox" id="ci-enabled" name="ciEnabled" value="true" checked
                               data-toggle-target="ci-timeout-group">
                        <label for="ci-enabled">CI / GitHub Actions enabled</label>
                    </div>
                    <div class="field-group" id="ci-timeout-group">
                        <label for="ci-timeout">CI Timeout (min)</label>
                        <input type="number" id="ci-timeout" name="ciTimeoutMinutes" value="15" min="1" max="60">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="ti ti-device-floppy" aria-hidden="true"></i> Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Repository table -->
    <div class="panel">
        <div class="panel-body">
            <table class="data-table repos-table">
                <thead>
                    <tr>
                        <th scope="col">Repository</th>
                        <th scope="col">Branch</th>
                        <th scope="col">Mode</th>
                        <th scope="col" title="Max iterations"><i class="ti ti-repeat" aria-hidden="true"></i> Iter</th>
                        <th scope="col" title="CI / GitHub Actions"><i class="ti ti-rocket" aria-hidden="true"></i> CI</th>
                        <th scope="col" title="Security review"><i class="ti ti-shield-lock" aria-hidden="true"></i> Review</th>
                        <th scope="col" title="Auto-merge PRs"><i class="ti ti-git-merge" aria-hidden="true"></i> Merge</th>
                        <th scope="col" title="Auto-start issues"><i class="ti ti-player-play" aria-hidden="true"></i> Auto</th>
                        <th scope="col" title="Review findings handling"><i class="ti ti-arrow-forward-up" aria-hidden="true"></i> Follow-Up</th>
                        <th scope="col" title="Open issues"><i class="ti ti-bug" aria-hidden="true"></i> Issues</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="repo : ${repos}">
                        <td data-label="Repository">
                            <a class="repo-link" target="_blank" rel="noopener"
                               th:href="${'https://github.com/' + repo.owner + '/' + repo.name}"
                               th:title="${'Open ' + repo.owner + '/' + repo.name + ' on GitHub'}">
                                <i class="ti ti-brand-github" aria-hidden="true"></i>
                                <strong th:text="${repo.owner + '/' + repo.name}">owner/repo</strong>
                                <i class="ti ti-external-link" aria-hidden="true"></i>
                            </a>
                        </td>
                        <td data-label="Branch" th:text="${repo.branch}">main</td>
                        <td data-label="Mode">
                            <span class="status" th:classappend="${repo.mode.name() == 'AUTONOMOUS' ? 'status-completed' : 'status-awaiting_approval'}" th:text="${repo.mode}">AUTONOMOUS</span>
                        </td>
                        <td data-label="Iter" th:text="${repo.maxIterations}">5</td>
                        <td data-label="CI">
                            <span th:if="${repo.ciEnabled}" class="status status-completed">ON</span>
                            <span th:unless="${repo.ciEnabled}" class="status status-pending">OFF</span>
                        </td>
                        <td data-label="Review">
                            <span th:if="${repo.securityReviewEnabled}" class="status status-awaiting_approval" title="Security review enabled">SEC</span>
                            <span th:text="${repo.maxReviewIterations}" class="text-sm text-muted" th:title="'Max ' + ${repo.maxReviewIterations} + ' review iterations'"></span>
                        </td>
                        <td data-label="Merge">
                            <span th:if="${repo.autoMerge}" class="status status-completed">AUTO</span>
                            <span th:unless="${repo.autoMerge}" class="status status-pending">MANUAL</span>
                        </td>
                        <td data-label="Auto">
                            <span th:if="${repo.autoStart}" class="status status-completed">ON</span>
                            <span th:unless="${repo.autoStart}" class="status status-pending">OFF</span>
                        </td>
                        <td data-label="Follow-Up">
                            <span class="status" th:classappend="${repo.followUpMode.name() == 'OFF' ? 'status-pending' : 'status-completed'}"
                                  th:text="${repo.followUpMode}" th:title="${repo.followUpMode}">ROLLING_BACKLOG</span>
                        </td>
                        <td data-label="Issues" th:text="${issueCounts.containsKey(repo.id) ? issueCounts.get(repo.id) : 0}">0</td>
                        <td data-label="Actions" class="repo-actions">
                            <button class="btn btn-outline btn-sm" type="button"
                                    data-edit-repo
                                    th:attr="data-id=${repo.id},
                                             data-owner=${repo.owner},
                                             data-name=${repo.name},
                                             data-branch=${repo.branch},
                                             data-mode=${repo.mode.name()},
                                             data-max-iterations=${repo.maxIterations},
                                             data-ci-enabled=${repo.ciEnabled},
                                             data-ci-timeout-minutes=${repo.ciTimeoutMinutes},
                                             data-auto-merge=${repo.autoMerge},
                                             data-security-review-enabled=${repo.securityReviewEnabled},
                                             data-max-review-iterations=${repo.maxReviewIterations},
                                             data-review-pass-threshold=${repo.reviewPassThreshold},
                                             data-issue-budget-usd=${repo.issueBudgetUsd},
                                             data-auto-start=${repo.autoStart},
                                             data-follow-up-mode=${repo.followUpMode.name()},
                                             data-decomposition-mode=${repo.decompositionMode.name()},
                                             data-pre-screen-enabled=${repo.preScreenEnabled},
                                             data-allowed-paths=${repo.allowedPaths},
                                             data-verification-commands=${repo.verificationCommands},
                                             data-implementation-model=${repo.implementationModel},
                                             data-review-model=${repo.reviewModel}">
                                <i class="ti ti-edit" aria-hidden="true"></i> Edit
                            </button>
                            <button class="btn btn-danger btn-sm"
                                    th:attr="hx-delete='/repositories/' + ${repo.id}"
                                    hx-target="#content"
                                    hx-disabled-elt="this"
                                    hx-confirm="Remove this repository? Local clones will not be deleted.">
                                <i class="ti ti-trash" aria-hidden="true"></i> Remove
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(repos)}">
                        <td colspan="11" class="text-muted" style="text-align:center;padding:2rem">No repositories configured. Click "Add Repository" to get started.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
